schemaVersion: att-template/v3.6
name: 中文本地付款
description: 使用中文目錄及中文符號名稱演示完整模板路徑解析。
actions:
  prepareRequest:
    type: assign
    name: requestText
    expression: "&{templates/付款/本地付款/request.tmp.xml}"
