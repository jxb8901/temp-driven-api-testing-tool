schemaVersion: att-template/v3.6
name: FPP_D3I_BATCH_SIT
description: SIT D3I batch end-to-end flow covering D3I, RLT012, DVO, DRR, and DSR processing.

# CASE path inputs:
# d3InputDirectory, d3WorkerDirectory, d3DoneDirectory, aftOutboundDirectory,
# iclOutboundDirectory, artifactDirectory, job2HandlerScript, job3HandlerScript,
# xml2IffScript, acDate, d3rltXmlFile, d3rltTextFile.
# Every *SqlFile must print one summary row with RECORD_COUNT, MATCH_COUNT,
# and RESULT_SUMMARY. Its MATCH_COUNT predicate implements the status named by
# the corresponding assertion. Every *ExpectedCount is supplied by testcase data.
actions:
  moveD3iFiles:
    type: tool
    description: "1. Move prepared FPSPD3I XML files into WKR_D3"
    call: "#{fpp.moveFiles(sourceDirectory=${EXEC.INPUT.d3InputDirectory}, pattern='FPSPD3I*.xml', targetDirectory=${EXEC.INPUT.d3WorkerDirectory}, overwrite=false)}"

  assertMoveD3iFiles:
    type: assert
    description: Prepared FPSPD3I files are moved to WKR_D3
    assert: "${EXEC.ACTIONS.moveD3iFiles.output.exitCode} == 0 and ${EXEC.ACTIONS.moveD3iFiles.output.result.count} > 0"
    expected: "one or more FPSPD3I*.xml files moved successfully"
    actual: "exitCode=${EXEC.ACTIONS.moveD3iFiles.output.exitCode}, count=${EXEC.ACTIONS.moveD3iFiles.output.result.count}, error=${EXEC.ACTIONS.moveD3iFiles.output.result.errorMessage}"

  runJob2D3i:
    type: tool
    description: "2. Execute Job2Handler.sh D3 for FPSPD3I"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job2HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job2-d3i.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job2-d3i.stderr.log', arguments='D3')}"

  assertJob2D3i:
    type: assert
    description: Job2 D3I processing reports no error
    assert: "${EXEC.ACTIONS.runJob2D3i.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob2D3i.output.result.exitCode}, error=${EXEC.ACTIONS.runJob2D3i.output.result.errorMessage}"

  queryD3iTxn:
    type: tool
    description: "2.1 Query D3 transactions after D3I Job2 processing"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.d3iTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/d3i-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/d3i-txn.err')}"
    timeoutMs: 10000
    retry: &dbRetry
      maxAttempts: 3
      intervalMs: 1000
      retryOn: [ASSERTION]
    assert: "${output.exitCode} == 0 and ${output.result.RowCount} == 1 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.d3iTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.d3iTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.d3iTxnExpectedCount}, SR_STUS=PCFM"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryD3iFileJnl:
    type: tool
    description: "2.2 Query TB_FILE_JNL for FPSPD3I"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.d3iFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/d3i-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/d3i-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.RowCount} == 1 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.d3iFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.d3iFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.d3iFileExpectedCount}, SR_FILE_STUS=P"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectD3iDone:
    type: tool
    description: "2.3 Inspect WKR_D3/done for processed FPSPD3I files"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.d3DoneDirectory}, pattern='FPSPD3I*.xml.*', expectedLineCount='')}"

  assertD3iDone:
    type: assert
    description: WKR_D3 done contains processed FPSPD3I files
    assert: "${EXEC.ACTIONS.inspectD3iDone.output.exitCode} == 0 and ${EXEC.ACTIONS.inspectD3iDone.output.result.count} > 0"
    expected: WKR_D3/done contains FPSPD3I*.xml.*
    actual: "count=${EXEC.ACTIONS.inspectD3iDone.output.result.count}"

  runJob3D3i:
    type: tool
    description: "3. Execute Job3Handler_iff.sh -104"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job3HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job3-104.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job3-104.stderr.log', arguments='-104')}"

  assertJob3D3i:
    type: assert
    description: Job3 -104 reports no error
    assert: "${EXEC.ACTIONS.runJob3D3i.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob3D3i.output.result.exitCode}, error=${EXEC.ACTIONS.runJob3D3i.output.result.errorMessage}"

  inspectD3iAftOutput:
    type: tool
    description: "3.1 Inspect AFT outbound 012D3D3I.TXT"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.aftOutboundDirectory}, pattern='012D3D3I.TXT', expectedLineCount='')}"

  assertD3iAftOutput:
    type: assert
    description: AFT outbound contains 012D3D3I.TXT
    assert: "${EXEC.ACTIONS.inspectD3iAftOutput.output.result.count} > 0"
    expected: /outbound/aft/012D3D3I.TXT exists
    actual: "count=${EXEC.ACTIONS.inspectD3iAftOutput.output.result.count}"

  inspectD3iFlistOutput:
    type: tool
    description: "3.1 Inspect AFT outbound D3I_FLIST0300.TXT"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.aftOutboundDirectory}, pattern='D3I_FLIST0300.TXT', expectedLineCount='')}"

  assertD3iFlistOutput:
    type: assert
    description: AFT outbound contains D3I_FLIST0300.TXT
    assert: "${EXEC.ACTIONS.inspectD3iFlistOutput.output.result.count} > 0"
    expected: /outbound/aft/D3I_FLIST0300.TXT exists
    actual: "count=${EXEC.ACTIONS.inspectD3iFlistOutput.output.result.count}"

  queryD3iOutboundTxn:
    type: tool
    description: "3.2 Query D3 transaction after Job3 -104"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.d3iOutboundTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/d3i-outbound-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/d3i-outbound-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.d3iOutboundTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.d3iOutboundTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.d3iOutboundTxnExpectedCount}, SR_STUS=OTWD"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryD3iOutboundFileJnl:
    type: tool
    description: "3.3 Query TB_FILE_JNL for 012D3D3I and D3I_FLIST0300"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.d3iOutboundFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/d3i-outbound-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/d3i-outbound-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.d3iOutboundFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.d3iOutboundFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.d3iOutboundFileExpectedCount}, SR_FILE_STUS=P and C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  convertD3Rlt:
    type: tool
    description: "4.1 Convert AFTD3RLT012 AcDate XML to IFF text"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.xml2IffScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/xml2iff.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/xml2iff.stderr.log', arguments=[${EXEC.INPUT.d3rltXmlFile}, ${EXEC.INPUT.d3rltTextFile}])}"

  assertConvertD3Rlt:
    type: assert
    description: XML2IFF conversion succeeds
    assert: "${EXEC.ACTIONS.convertD3Rlt.output.result.exitCode} == 0"
    expected: "AFTD3RLT012_${EXEC.INPUT.acDate}.XML.txt generated"
    actual: "exitCode=${EXEC.ACTIONS.convertD3Rlt.output.result.exitCode}, error=${EXEC.ACTIONS.convertD3Rlt.output.result.errorMessage}"

  moveD3Rlt:
    type: tool
    description: "4.2 Move AFTD3RLT012 AcDate text into WKR_D3"
    call: "#{fpp.moveFiles(sourceDirectory=${EXEC.INPUT.d3InputDirectory}, pattern='AFTD3RLT012_${EXEC.INPUT.acDate}.txt', targetDirectory=${EXEC.INPUT.d3WorkerDirectory}, overwrite=false)}"

  assertMoveD3Rlt:
    type: assert
    description: Prepared AFTD3RLT012 text is moved to WKR_D3
    assert: "${EXEC.ACTIONS.moveD3Rlt.output.exitCode} == 0 and ${EXEC.ACTIONS.moveD3Rlt.output.result.count} == 1"
    expected: "AFTD3RLT012_${EXEC.INPUT.acDate}.txt moved successfully"
    actual: "count=${EXEC.ACTIONS.moveD3Rlt.output.result.count}, error=${EXEC.ACTIONS.moveD3Rlt.output.result.errorMessage}"

  runJob2Rlt:
    type: tool
    description: "5. Execute Job2Handler.sh D3 for RLT012"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job2HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job2-rlt.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job2-rlt.stderr.log', arguments='D3')}"

  assertJob2Rlt:
    type: assert
    description: Job2 RLT012 processing reports no error
    assert: "${EXEC.ACTIONS.runJob2Rlt.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob2Rlt.output.result.exitCode}, error=${EXEC.ACTIONS.runJob2Rlt.output.result.errorMessage}"

  queryRltTxn:
    type: tool
    description: "5.1 Query D3 RLT012 transaction"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.rltTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/rlt-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/rlt-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.rltTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.rltTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.rltTxnExpectedCount}, SR_STUS=CFM"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryRltFileJnl:
    type: tool
    description: "5.2 Query TB_FILE_JNL for RLT012"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.rltFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/rlt-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/rlt-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.rltFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.rltFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.rltFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectRltDone:
    type: tool
    description: "5.3 Inspect WKR_D3/done for RLT012 text"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.d3DoneDirectory}, pattern='AFTD3RLT012_${EXEC.INPUT.acDate}.txt', expectedLineCount='')}"

  assertRltDone:
    type: assert
    description: WKR_D3 done contains RLT012 text
    assert: "${EXEC.ACTIONS.inspectRltDone.output.result.count} == 1"
    expected: "WKR_D3/done/AFTD3RLT012_${EXEC.INPUT.acDate}.txt exists"
    actual: "count=${EXEC.ACTIONS.inspectRltDone.output.result.count}"

  runJob3Rlt:
    type: tool
    description: "6. Execute Job3Handler_iff.sh -105"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job3HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job3-105.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job3-105.stderr.log', arguments='-105')}"

  assertJob3Rlt:
    type: assert
    description: Job3 -105 reports no error
    assert: "${EXEC.ACTIONS.runJob3Rlt.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob3Rlt.output.result.exitCode}, error=${EXEC.ACTIONS.runJob3Rlt.output.result.errorMessage}"

  inspectDvoOutput:
    type: tool
    description: "6.1 Inspect ICL outbound for nine-line FPSPDVO XML"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.iclOutboundDirectory}, pattern='FPSPDVO*.xml', expectedLineCount=9)}"

  assertDvoOutput:
    type: assert
    description: ICL outbound contains expected nine-line DVO files
    assert: "${EXEC.ACTIONS.inspectDvoOutput.output.result.count} == ${EXEC.INPUT.dvoExpectedFileCount} and ${EXEC.ACTIONS.inspectDvoOutput.output.result.lineCountMatches} == true"
    expected: "fileCount=${EXEC.INPUT.dvoExpectedFileCount}, each FPSPDVO*.xml has 9 lines"
    actual: "fileCount=${EXEC.ACTIONS.inspectDvoOutput.output.result.count}, lineCountMatches=${EXEC.ACTIONS.inspectDvoOutput.output.result.lineCountMatches}"

  queryDvoTxn:
    type: tool
    description: "6.2 Query D3 DVO transaction"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dvoTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dvo-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dvo-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dvoTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dvoTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dvoTxnExpectedCount}, SR_STUS=OTWD"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryDvoFileJnl:
    type: tool
    description: "6.3 Query TB_FILE_JNL for DVO"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dvoFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dvo-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dvo-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dvoFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dvoFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dvoFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectDrrInput:
    type: tool
    description: "7. Inspect prepared ten-line FPSPDRR XML files"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.d3InputDirectory}, pattern='FPSPDRR*.xml', expectedLineCount=10)}"

  assertDrrInput:
    type: assert
    description: Prepared DRR files contain ten lines
    assert: "${EXEC.ACTIONS.inspectDrrInput.output.result.count} == ${EXEC.INPUT.drrExpectedFileCount} and ${EXEC.ACTIONS.inspectDrrInput.output.result.lineCountMatches} == true"
    expected: "fileCount=${EXEC.INPUT.drrExpectedFileCount}, each FPSPDRR*.xml has 10 lines"
    actual: "fileCount=${EXEC.ACTIONS.inspectDrrInput.output.result.count}, lineCountMatches=${EXEC.ACTIONS.inspectDrrInput.output.result.lineCountMatches}"

  moveDrrFiles:
    type: tool
    description: "7. Move prepared FPSPDRR XML files into WKR_D3"
    call: "#{fpp.moveFiles(sourceDirectory=${EXEC.INPUT.d3InputDirectory}, pattern='FPSPDRR*.xml', targetDirectory=${EXEC.INPUT.d3WorkerDirectory}, overwrite=false)}"

  assertMoveDrrFiles:
    type: assert
    description: Prepared FPSPDRR files are moved to WKR_D3
    assert: "${EXEC.ACTIONS.moveDrrFiles.output.exitCode} == 0 and ${EXEC.ACTIONS.moveDrrFiles.output.result.count} == ${EXEC.INPUT.drrExpectedFileCount}"
    expected: "${EXEC.INPUT.drrExpectedFileCount} FPSPDRR files moved successfully"
    actual: "count=${EXEC.ACTIONS.moveDrrFiles.output.result.count}, error=${EXEC.ACTIONS.moveDrrFiles.output.result.errorMessage}"

  runJob2Drr:
    type: tool
    description: "8. Execute Job2Handler.sh D3 for DRR"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job2HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job2-drr.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job2-drr.stderr.log', arguments='D3')}"

  assertJob2Drr:
    type: assert
    description: Job2 DRR processing reports no error
    assert: "${EXEC.ACTIONS.runJob2Drr.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob2Drr.output.result.exitCode}, error=${EXEC.ACTIONS.runJob2Drr.output.result.errorMessage}"

  queryDrrTxn:
    type: tool
    description: "8.1 Query D3 DRR transactions"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.drrTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/drr-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/drr-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.drrTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.drrTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.drrTxnExpectedCount}, SR_STUS=(CAPT or CRJT) and PCFM"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryDrrFileJnl:
    type: tool
    description: "8.2 Query TB_FILE_JNL for DRR"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.drrFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/drr-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/drr-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.drrFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.drrFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.drrFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectDrrDone:
    type: tool
    description: "8.3 Inspect WKR_D3/done for processed FPSPDRR files"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.d3DoneDirectory}, pattern='FPSPDRR*.xml.*', expectedLineCount='')}"

  assertDrrDone:
    type: assert
    description: WKR_D3 done contains processed FPSPDRR files
    assert: "${EXEC.ACTIONS.inspectDrrDone.output.result.count} == ${EXEC.INPUT.drrExpectedFileCount}"
    expected: "${EXEC.INPUT.drrExpectedFileCount} FPSPDRR*.xml.* files"
    actual: "count=${EXEC.ACTIONS.inspectDrrDone.output.result.count}"

  runJob3Drr:
    type: tool
    description: "9. Execute Job3Handler_iff.sh -106"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job3HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job3-106.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job3-106.stderr.log', arguments='-106')}"

  assertJob3Drr:
    type: assert
    description: Job3 -106 reports no error
    assert: "${EXEC.ACTIONS.runJob3Drr.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob3Drr.output.result.exitCode}, error=${EXEC.ACTIONS.runJob3Drr.output.result.errorMessage}"

  queryDrrCapSent:
    type: tool
    description: "9.1 Query D3 DRR capture-sent state"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.drrCapSentSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/drr-cap-sent.out', stderrPath='${EXEC.INPUT.artifactDirectory}/drr-cap-sent.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.drrCapExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.drrCapExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.drrCapExpectedCount}, SR_IS_CAP_SENT=S"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryDrrCapFileJnl:
    type: tool
    description: "9.2 Query TB_FILE_JNL after DRR capture send"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.drrCapFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/drr-cap-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/drr-cap-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.drrCapFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.drrCapFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.drrCapFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectDrrAftOutput:
    type: tool
    description: "9.3 Inspect AFT outbound 012D3DRR.TXT"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.aftOutboundDirectory}, pattern='012D3DRR.TXT', expectedLineCount='')}"

  assertDrrAftOutput:
    type: assert
    description: AFT outbound contains 012D3DRR.TXT
    assert: "${EXEC.ACTIONS.inspectDrrAftOutput.output.result.count} == 1"
    expected: /outbound/aft/012D3DRR.TXT exists
    actual: "count=${EXEC.ACTIONS.inspectDrrAftOutput.output.result.count}"

  inspectDsrInput:
    type: tool
    description: "10. Inspect prepared ten-line FPSPDSR XML files"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.d3InputDirectory}, pattern='FPSPDSR*.xml', expectedLineCount=10)}"

  assertDsrInput:
    type: assert
    description: Prepared DSR files contain ten lines
    assert: "${EXEC.ACTIONS.inspectDsrInput.output.result.count} == ${EXEC.INPUT.dsrExpectedFileCount} and ${EXEC.ACTIONS.inspectDsrInput.output.result.lineCountMatches} == true"
    expected: "fileCount=${EXEC.INPUT.dsrExpectedFileCount}, each FPSPDSR*.xml has 10 lines"
    actual: "fileCount=${EXEC.ACTIONS.inspectDsrInput.output.result.count}, lineCountMatches=${EXEC.ACTIONS.inspectDsrInput.output.result.lineCountMatches}"

  moveDsrFiles:
    type: tool
    description: "10. Move prepared FPSPDSR XML files into WKR_D3"
    call: "#{fpp.moveFiles(sourceDirectory=${EXEC.INPUT.d3InputDirectory}, pattern='FPSPDSR*.xml', targetDirectory=${EXEC.INPUT.d3WorkerDirectory}, overwrite=false)}"

  assertMoveDsrFiles:
    type: assert
    description: Prepared FPSPDSR files are moved to WKR_D3
    assert: "${EXEC.ACTIONS.moveDsrFiles.output.exitCode} == 0 and ${EXEC.ACTIONS.moveDsrFiles.output.result.count} == ${EXEC.INPUT.dsrExpectedFileCount}"
    expected: "${EXEC.INPUT.dsrExpectedFileCount} FPSPDSR files moved successfully"
    actual: "count=${EXEC.ACTIONS.moveDsrFiles.output.result.count}, error=${EXEC.ACTIONS.moveDsrFiles.output.result.errorMessage}"

  runJob2Dsr:
    type: tool
    description: "11. Execute Job2Handler.sh D3 for DSR"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job2HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job2-dsr.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job2-dsr.stderr.log', arguments='D3')}"

  assertJob2Dsr:
    type: assert
    description: Job2 DSR processing reports no error
    assert: "${EXEC.ACTIONS.runJob2Dsr.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob2Dsr.output.result.exitCode}, error=${EXEC.ACTIONS.runJob2Dsr.output.result.errorMessage}"

  queryDsrTxn:
    type: tool
    description: "11.1 Query D3 DSR transactions"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dsrTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dsr-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dsr-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dsrTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dsrTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dsrTxnExpectedCount}, SR_STUS=(ACPT or UCPT) and (SUCC or RJCT)"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryDsrFileJnl:
    type: tool
    description: "11.2 Query TB_FILE_JNL for DSR"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dsrFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dsr-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dsr-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dsrFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dsrFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dsrFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectDsrOutbound:
    type: tool
    description: "11.3 Inspect AFT outbound for processed FPSPDSR XML"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.aftOutboundDirectory}, pattern='FPSPDSR*.xml.*', expectedLineCount='')}"

  assertDsrOutbound:
    type: assert
    description: AFT outbound contains processed FPSPDSR files
    assert: "${EXEC.ACTIONS.inspectDsrOutbound.output.result.count} == ${EXEC.INPUT.dsrExpectedFileCount}"
    expected: "${EXEC.INPUT.dsrExpectedFileCount} FPSPDSR*.xml.* files"
    actual: "count=${EXEC.ACTIONS.inspectDsrOutbound.output.result.count}"

  runJob3Dsr:
    type: tool
    description: "12. Execute Job3Handler_iff.sh -107"
    call: "#{fpp.exehelper(command=${EXEC.INPUT.job3HandlerScript}, stdoutPath='${EXEC.INPUT.artifactDirectory}/job3-107.stdout.log', stderrPath='${EXEC.INPUT.artifactDirectory}/job3-107.stderr.log', arguments='-107')}"

  assertJob3Dsr:
    type: assert
    description: Job3 -107 reports no error
    assert: "${EXEC.ACTIONS.runJob3Dsr.output.result.exitCode} == 0"
    expected: exitCode=0
    actual: "exitCode=${EXEC.ACTIONS.runJob3Dsr.output.result.exitCode}, error=${EXEC.ACTIONS.runJob3Dsr.output.result.errorMessage}"

  queryDsrFinalTxn:
    type: tool
    description: "12.1 Query final D3 DSR transaction state"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dsrFinalTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dsr-final-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dsr-final-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dsrFinalTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dsrFinalTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dsrFinalTxnExpectedCount}, SR_STUS=SUCC or RJCT"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryDsrFinalFileJnl:
    type: tool
    description: "12.2 Query final TB_FILE_JNL DSR state"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.dsrFinalFileJnlSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/dsr-final-file-jnl.out', stderrPath='${EXEC.INPUT.artifactDirectory}/dsr-final-file-jnl.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.dsrFinalFileExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.dsrFinalFileExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.dsrFinalFileExpectedCount}, SR_FILE_STUS=C"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  inspectDsrAftOutput:
    type: tool
    description: "12.3 Inspect AFT outbound 012D3DSR.TXT"
    call: "#{fpp.inspectFiles(directory=${EXEC.INPUT.aftOutboundDirectory}, pattern='012D3DSR.TXT', expectedLineCount='')}"

  assertDsrAftOutput:
    type: assert
    description: AFT outbound contains 012D3DSR.TXT
    assert: "${EXEC.ACTIONS.inspectDsrAftOutput.output.result.count} == 1"
    expected: /outbound/aft/012D3DSR.TXT exists
    actual: "count=${EXEC.ACTIONS.inspectDsrAftOutput.output.result.count}"

  logD3iSummary:
    type: log
    message: "D3I batch end-to-end flow completed for ${META.SOURCE.caseId}"
    value:
      d3iFiles: "${EXEC.ACTIONS.moveD3iFiles.output.result.count}"
      drrFiles: "${EXEC.ACTIONS.moveDrrFiles.output.result.count}"
      dsrFiles: "${EXEC.ACTIONS.moveDsrFiles.output.result.count}"
