schemaVersion: att-tool/v1
id: findByDate
name: Find orders by date
description: Query through a package-contained rendered SQL file
call: "#{db.orders.query(sql=&{sql/orders-by-date.sql}, params=[${input.customerId}, ${input.fromDate}])}"
arguments:
  customerId:
    name: Customer ID
    description: Customer whose orders are returned
    required: true
  fromDate:
    name: From date
    description: Inclusive order date lower bound
    required: true
