schemaVersion: att-template/v3.6
name: V3_FLOW_EXAMPLE
description: Template composing isolated Flow Action scopes across Run, Debug and Load.
actions:
  compose:
    type: flow
    description: Compose the Case value through two nested Flows.
    use: common.compose.v1
  verify:
    type: assert
    description: Verify the explicit EXEC.VARS value published by the Flow.
    assert: >-
      #{#{misc.coalesce(${META.SOURCE.caseId?}, ${EXEC.ID})} in [#{misc.coalesce(${META.SOURCE.caseId?}, ${EXEC.ID})}]
        and ${EXEC.VARS.decoratedResult} == #{str.concat(#{misc.coalesce(${META.SOURCE.caseId?}, ${EXEC.ID})}, '-done')}
        and (1 + 2 * 3) == 7}
    expected: "#{misc.coalesce(${META.SOURCE.caseId?}, ${EXEC.ID})}-done"
    actual: "${EXEC.VARS.decoratedResult}"
