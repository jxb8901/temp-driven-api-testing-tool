schemaVersion: att-config/v2.13
outputDirectory: output
environment: UAT
timeoutMs: 10000
caseLog:
  yamlAnchors: false
testcase:
  root: testcase

run:
  id:
    default: timestamp
    timestampFormat: yyyyMMdd-HHmmss

templates:
  root: templates

execution:
  processOutput:
    memoryLimitBytes: 65536
    artifactLimitBytes: 104857600

dbhelpers:
  - config/dbhelpers/uat/orders.yaml
mqhelpers:
  - config/mqhelpers/uat/payment.yaml

report:
  mode: append-to-copy
  fileNamePattern: "${suiteName}.result.xlsx"
  html:
    caseLogInlineLimitBytes: 32768
  columns:
    result: Test Result
    durationMs: Duration(ms)
    expectedResult: Expected Result
    actualResult: Actual Result
    caseLog: Case Log
    runTime: Run Time

