# Example for ATT_HOME=/opt/att. Replace these absolute paths for your installation.
# YAML paths are filesystem paths; shell variables are not expanded.
# Copy to ATT_HOME/config/att-server.yaml or a protected external path.
server:
  dataDir: /opt/att/data
  auth:
    # container preserves Tomcat Realm/SSO; local enables ATT login and local accounts.
    mode: container
  # Legacy container-mode setting. false enables shared anonymous access; never use with local mode.
  authenticationRequired: true
  # Optional. Defaults to the Java runtime hosting Tomcat.
  # javaExecutable: /usr/lib/jvm/java-17/bin/java
  maxRequestBytes: 1048576
  maxEventsPerJob: 10000
  maxArtifacts: 1000
  # Terminal job metadata, event journals, and artifacts are removed after this many days.
  jobRetentionDays: 30
  # Read-only package discovery. Each inspector runs in a bounded one-shot Worker.
  inspection:
    enabled: true
    maxConcurrent: 2
    queuedLimit: 16
    timeoutMs: 30000
    heapMaxMb: 512
    maxResponseBytes: 262144
    maxSourceBytes: 65536
    sourceBrowsing:
      enabled: true
      policy: safe-package-files
      denyGlobs: []
      # Optional external script roots; use canonical absolute directories.
      # externalSourceRoots:
      #   - /srv/att/external-scripts
      # Exact canonical files are enabled per package; wildcards are not accepted.
      # externalTextSources:
      #   payments:
      #     - /srv/att/external-scripts/mq/check-queue.sh
    redaction:
      enabled: false
      sensitivePaths: []
      sensitiveFieldPatterns: []
    # Legacy exact package-relative allowlist, used with policy: allowlist-only.
    # These paths are never treated as external filesystem paths.
    # safeTextSources:
    #   default:
    #     - tools/payment-check.sh
  # Origin equality checking is disabled by default; local cookie auth still requires CSRF.
  security:
    checkCrossOrigin: false
  # Browser-submitted Quick and Advanced Load are disabled unless explicitly enabled.
  inlineLoad:
    enabled: false
    maxWorkloads: 10
    maxTargets: 20
    maxTotalUsers: 100
    maxAggregateArrivalRatePerSecond: 100
    maxConcurrentPerWorkload: 100
    maxTotalConcurrent: 1000
    maxDurationSeconds: 3600
  # Recurring package-backed Load schedules are disabled unless enabled here.
  scheduling:
    enabled: false
    # Defaults to true only when authenticationRequired is false and scheduling is enabled.
    # Set false to keep schedule management restricted to the configured role.
    # allowAnonymousManagement: false
    adminRole: ATT_ADMIN
    maxSchedules: 100
    minimumIntervalMinutes: 15
    pollIntervalSeconds: 10
    maxConcurrentRuns: 1
    failurePolicy: continue
    maxExecutionsPerSchedule: 10000

workers:
  maxConcurrent: 8
  queuedLimit: 100
  # Maximum admitted Load jobs (queued or executing); excess submissions receive HTTP 429.
  maxConcurrentLoad: 2
  gracefulStopMs: 10000
  # Optional per-Worker heap bounds. Set heapMaxMb to limit each isolated process;
  # heapInitialMb requires heapMaxMb and cannot exceed it.
  # heapInitialMb: 256
  # heapMaxMb: 1024
  # Optional directories containing external JDBC, MQ, or other Worker dependency JARs.
  libraryDirs: []

packages:
  allowedRoots:
    - /opt/att/packages
  entries:
    default: /opt/att/packages/default
