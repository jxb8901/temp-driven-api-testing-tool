schemaVersion: att-config/v2.13
outputDirectory: output
environment: SIT
timeoutMs: 10000
caseLog:
  yamlAnchors: false
testcase:
  root: testcase

run:
  id:
    default: timestamp
    timestampFormat: yyyyMMdd-HHmmss

templates:
  root: templates

execution:
  processOutput:
    memoryLimitBytes: 65536
    artifactLimitBytes: 104857600

# Each referenced file declares one independent att-dbhelper/v2.6 instance.
dbhelpers:
  - config/dbhelpers/orders.yaml

report:
  mode: append-to-copy
  fileNamePattern: "${suiteName}.result.xlsx"
  html:
    caseLogInlineLimitBytes: 32768
  columns:
    execId: Execution ID
    result: Test Result
    durationMs: Duration(ms)
    expectedResult: Expected Result
    actualResult: Actual Result
    caseLog: Case Log
    runTime: Run Time

# ATT 4.1.0 profile example. Common settings and logical helper IDs stay stable;
# each profile replaces only the resource descriptor lists it declares.
environments:
  SIT:
    dbhelpers: [config/dbhelpers/sit/orders.yaml]
    mqhelpers: [config/mqhelpers/sit/payment.yaml]
  UAT:
    dbhelpers: [config/dbhelpers/uat/orders.yaml]
    mqhelpers: [config/mqhelpers/uat/payment.yaml]
