schemaVersion: att-config/v2.11
outputDirectory: output
environment: SIT
timeoutMs: 10000
caseLog:
  yamlAnchors: false
testcase:
  root: testcase

run:
  id:
    default: timestamp
    timestampFormat: yyyyMMdd-HHmmss

templates:
  root: templates

execution:
  processOutput:
    memoryLimitBytes: 65536
    artifactLimitBytes: 104857600

toolGroups:
  - config/tools/sample.yaml
  - config/tools/fpp.yaml
  - config/tools/orders-db.yaml

# Each referenced file declares one independent att-dbhelper/v2.6 instance.
dbhelpers:
  - config/dbhelpers/orders.yaml

report:
  mode: append-to-copy
  fileNamePattern: "${suiteName}.result.xlsx"
  html:
    caseLogInlineLimitBytes: 32768
  columns:
    execId: Execution ID
    result: Test Result
    durationMs: Duration(ms)
    expectedResult: Expected Result
    actualResult: Actual Result
    caseLog: Case Log
    runTime: Run Time

tools:
  invokePaymentApi:
    name: Invoke Payment API
    description: Invoke the payment API with a rendered request document
    command: [./tools/invoke_payment_api.sh, "${input.requestText}", "${input.environment}"]
    stdoutFormat: xml
    arguments:
      requestText:
        name: Request Text
        description: Rendered payment request document text
        required: true
      environment:
        name: Environment
        description: Target execution environment
        required: true
  selectCtxn:
    name: Select CT records
    description: Query transaction records
    command: [./tools/select_ct_txn.sh, "${input.caseId}", "${input.txnRef}"]
    stdoutFormat: yaml
    arguments:
      caseId:
        name: Case ID
        description: Full V2 Case ID
        required: true
      txnRef:
        name: Transaction Reference
        description: Optional transaction reference
        required: false
  grepFromAppLogs:
    name: Grep application logs
    description: Find one or more keywords in application logs
    command: [./tools/grep_from_app_logs.sh, "${input.logText}", "${input.keywords}"]
    stdoutFormat: yaml
    arguments:
      logText:
        name: Log Text
        description: Application log text to search
        required: true
      keywords:
        name: Keywords
        description: Ordered YAML array of literal keywords
        required: true
  getAppLogs:
    name: Get application logs
    description: Collect application logs for a case
    command: [./tools/get_app_logs.sh, "${input.caseId}"]
    stdoutFormat: text
    arguments:
      caseId:
        name: Case ID
        description: Full V2 Case ID
        required: true
  genEndToEndId:
    name: Generate end-to-end ID
    description: Generate a unique end-to-end identifier
    command: [./tools/gen_e2e_id.sh, "${input.caseId}"]
    stdoutFormat: text
    arguments:
      caseId:
        name: Case ID
        description: Full V2 Case ID
        required: true
  getAcDate:
    name: Get account date
    description: Return the current account date
    command: [./tools/get_ac_date.sh]
    stdoutFormat: text
    arguments: {}
  getSeq:
    name: Get sequence
    description: Generate a new sequence value
    command: [./tools/get_seq.sh, "${input.caseId}"]
    stdoutFormat: text
    arguments:
      caseId:
        name: Case ID
        description: Full V2 Case ID
        required: true

# ATT 3.7.0 profile example. Common settings and logical helper IDs stay stable;
# each profile replaces only the resource descriptor lists it declares.
environments:
  SIT:
    dbhelpers: [config/dbhelpers/sit/orders.yaml]
    mqhelpers: [config/mqhelpers/sit/payment.yaml]
    testdata: [config/testdata/accounts.yaml]
  UAT:
    dbhelpers: [config/dbhelpers/uat/orders.yaml]
    mqhelpers: [config/mqhelpers/uat/payment.yaml]
    testdata: [config/testdata/accounts.yaml]
