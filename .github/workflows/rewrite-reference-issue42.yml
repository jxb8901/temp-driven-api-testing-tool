name: Rewrite Reference Manual for Issue 42

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rewrite-reference-issue42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Apply Reference migration
        run: |
          python3 tools/rewrite_reference_issue42.py
          python3 tools/build_reference_manual.py
          python3 tools/validate_reference_content.py

      - name: Commit migrated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
          else
            git commit -m 'Rewrite Reference Manual content for issue 42'
            git push origin HEAD:master
          fi
