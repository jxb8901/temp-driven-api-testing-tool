name: Finalize Reference Manual Issue 42

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rewrite-reference-issue42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Normalize Test Authoring section numbers
        run: |
          sed -i -E 's/^#{3,5} 3\.1 /### 2.1 /; s/^#{3,5} 3\.2 /### 2.2 /' docs/reference/02_test_authoring.md
          sed -i -E 's/^#{3,5} 3\.1 /### 2.1 /; s/^#{3,5} 3\.2 /### 2.2 /' docs/reference.zh/02_test_authoring.md

      - name: Regenerate and verify Reference Manual
        run: |
          python3 tools/build_reference_manual.py
          python3 tools/validate_reference_content.py
          python3 tools/build_reference_manual.py --check

      - name: Remove one-time migration machinery
        run: |
          rm -f tools/rewrite_reference_issue42.py
          rm -f tools/bootstrap_reference_sources.py
          rm -f .github/workflows/rewrite-reference-issue42.yml

      - name: Commit final issue 42 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs tools .github/workflows
          git commit -m 'Finalize issue 42 Reference information architecture'
          git push origin HEAD:master
