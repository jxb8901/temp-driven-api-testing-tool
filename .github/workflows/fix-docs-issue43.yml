name: Fix documentation consistency for issue 43

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-docs-issue43.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Apply source fixes
        run: python3 tools/fix_docs_issue43.py

      - name: Regenerate and validate
        run: |
          python3 tools/build_reference_manual.py
          python3 tools/verify_documentation.py

      - name: Commit fixes and remove one-time migration files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/fix_docs_issue43.py
          rm -f .github/workflows/fix-docs-issue43.yml
          git add -A docs tools .github/workflows
          git commit -m 'Fix documentation drift detected by issue 43 gate'
          git push origin HEAD:master
