name: Bootstrap Reference Manual

on:
  push:
    branches: [master]
    paths:
      - 'tools/bootstrap_reference_sources.py'
      - 'tools/build_reference_manual.py'
      - '.github/workflows/bootstrap-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Bootstrap modular sources
        run: python3 tools/bootstrap_reference_sources.py

      - name: Generate combined manuals
        run: python3 tools/build_reference_manual.py

      - name: Commit generated modularization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference docs/reference.zh docs/reference-manifest.txt docs/generated \
                  docs/09_Reference_Manual_V3.md docs/09_Reference_Manual_V3.html \
                  docs/09_Reference_Manual_V3.zh.md docs/09_Reference_Manual_V3.zh.html
          if git diff --cached --quiet; then
            echo 'No bootstrap changes required.'
          else
            git commit -m 'Modularize Reference Manual sources for issue 41'
            git push origin HEAD:master
          fi
