name: Refresh PR 106 review manuals
on:
  push:
    branches:
      - feature/att-3.6.1-issues-89-100-101-102
permissions:
  contents: write
concurrency:
  group: pr-106-review-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify SSH regression tests
        run: mvn -B -ntp -Dtest=SshResourceHelperTest test
      - name: Install pinned Pandoc
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb \
            --output "$RUNNER_TEMP/pandoc.deb"
          echo 'caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  '"$RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - name: Regenerate Reference manuals
        run: python3 tools/build_reference_manual.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference.md docs/reference.html docs/reference.zh.md docs/reference.zh.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate manuals after SSH review fixes"
            git push origin HEAD:feature/att-3.6.1-issues-89-100-101-102
          fi
      - name: Verify documentation release gate
        run: python3 tools/verify_documentation.py
