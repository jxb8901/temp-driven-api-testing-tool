name: Finalize Reference Modularization

# One-shot workflow: it removes itself after applying the release-build patch.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/finalize-reference-modularization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch release build and remove bootstrap workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.sh')
          text = p.read_text()
          old = '''if ! command -v mvn >/dev/null 2>&1; then
            echo "mvn is required to execute the V3.5.1 release gate" >&2
            exit 2
          fi

          (cd "$ROOT_DIR" && mvn test)
          '''
          new = '''if ! command -v mvn >/dev/null 2>&1; then
            echo "mvn is required to execute the V3.5.1 release gate" >&2
            exit 2
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 is required to generate the modular Reference Manual" >&2
            exit 2
          fi
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "pandoc is required to generate the modular Reference Manual" >&2
            exit 2
          fi

          (cd "$ROOT_DIR" && python3 tools/build_reference_manual.py)
          (cd "$ROOT_DIR" && mvn test)
          '''
          if old not in text:
              raise SystemExit('Expected build.sh release-gate block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/bootstrap-reference.yml
          rm -f .github/workflows/finalize-reference-modularization.yml

      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.sh .github/workflows
          git commit -m 'Integrate modular Reference Manual into release build'
          git push origin HEAD:master
