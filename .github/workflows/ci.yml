name: CI

on:
  push:
    branches:
      - master
      - load
      - docs/fix-46-47-layout
  pull_request:
    branches:
      - master
      - load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Java 8 / Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Regenerate Reference outputs on documentation migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/docs/fix-46-47-layout'
        run: python3 tools/build_reference_manual.py

      - name: Commit regenerated Reference outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/docs/fix-46-47-layout'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference.md docs/reference.html docs/reference.zh.md docs/reference.zh.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Reference manuals after docs layout migration"
            git push origin HEAD:docs/fix-46-47-layout
          fi

      - name: Verify
        run: mvn -B -ntp clean verify

      - name: Verify documentation release gate
        run: python3 tools/verify_documentation.py

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
