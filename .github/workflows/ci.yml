name: CI

on:
  push:
    branches:
      - master
      - load
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full browser matrix only on default branch or manual runs; PRs stay Chromium-only.
  FULL_BROWSER_SUITE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/load')) }}

jobs:
  java-8-compatibility:
    name: Java 8 / CLI, Engine, and Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Java 8 modules
        run: mvn -B -ntp -pl att-engine,att-cli,att-worker -am clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java8-${{ github.run_id }}
          path: |
            att-engine/target/surefire-reports/
            att-cli/target/surefire-reports/
            att-worker/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend-unit:
    name: Frontend typecheck, unit tests, and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: att-web/frontend/package-lock.json

      - name: Verify React, TypeScript, component tests, Vite build, and bundle budget
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run bundle:budget
        working-directory: att-web/frontend

      - name: Verify ATT Web UI JavaScript
        run: |
          node --check att-web/src/main/resources/META-INF/resources/ui/app.js
          node --test att-web/src/test/js/*.test.mjs

  java-17-server-and-release:
    name: Java 17 / Server and full distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up pinned Node.js for build-time UI tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            att-web/frontend/package-lock.json
            tools/ui-acceptance/package-lock.json

      - name: Install Pandoc
        run: |
          # Keep generated HTML stable across hosted runner image updates.
          curl --fail --location --silent --show-error \
            https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb \
            --output "$RUNNER_TEMP/pandoc.deb"
          echo 'caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc  '"$RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -n 1 | grep -Fx 'pandoc 3.1.3'

      - name: Install Playwright Chromium for ServerWarUiIT
        working-directory: tools/ui-acceptance
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify documentation release gate
        run: python3 tools/verify_documentation.py

      - name: Verify assembled release
        env:
          ATT_UI_SERVER_PLAYWRIGHT: "1"
        run: ./build.sh

      - name: Upload Local and Server release packages
        uses: actions/upload-artifact@v4
        with:
          name: att-release-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/releases/att-*-local.tar.gz
            dist/releases/att-*-server.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-17-surefire-reports-${{ github.run_id }}
          path: |
            att-engine/target/surefire-reports/
            att-cli/target/surefire-reports/
            att-worker/target/surefire-reports/
            att-server/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Static UI harness (tools/ui-acceptance) uses its own Python fixture — it does not
  # need build.sh output and can run in parallel with the Java 17 release job.
  ui-browser-acceptance:
    name: UI browser acceptance (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            browsers: chromium
          - suite: smoke:explorer
            browsers: chromium
          - suite: smoke:auth
            browsers: chromium
          - suite: smoke:scheduled-load
            browsers: chromium
          - suite: smoke:cross-browser
            browsers: all
            full_only: true
          - suite: screenshots
            browsers: chromium
            full_only: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip full-only suite on pull requests
        id: gate
        run: |
          if [ "${{ matrix.full_only }}" = "true" ] && [ "${{ env.FULL_BROWSER_SUITE }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.suite }} on PR (runs on master/load/workflow_dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pinned Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: tools/ui-acceptance/package-lock.json

      - name: Install browser acceptance dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci
        working-directory: tools/ui-acceptance

      - name: Cache Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/ui-acceptance/package-lock.json') }}-${{ matrix.browsers }}

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        working-directory: tools/ui-acceptance
        run: |
          if [ "${{ matrix.browsers }}" = "all" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run UI suite
        if: steps.gate.outputs.skip != 'true'
        run: npm run ${{ matrix.suite }}
        working-directory: tools/ui-acceptance

      - name: Upload Scheduled Load cross-browser screenshots
        if: always() && steps.gate.outputs.skip != 'true' && matrix.suite == 'smoke:cross-browser'
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-load-browser-screenshots-${{ github.run_id }}
          path: tools/ui-acceptance/artifacts/scheduled-load/
          if-no-files-found: ignore
          retention-days: 7

  windows-worker-process-tree:
    name: Java 8 Windows Tool and source-launcher regressions
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Java 8 Windows Tool cancellation and source-tree launcher
        run: mvn -B -ntp -pl att-cli,att-worker -am "-Dtest=ProcessTreeTerminatorWindowsTest,WorkerMainTest#terminatingWorkerStopsAnActiveCommandBackedTool,WindowsLauncherTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
