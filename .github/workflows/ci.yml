name: CI

on:
  push:
    branches:
      - master
      - load
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run the full Chromium, Firefox, and WebKit screenshot matrix
        type: boolean
        default: true
      update_visual_baselines:
        description: Capture replacement Linux baselines as an artifact for review
        type: boolean
        default: false
      visual_baseline_reason:
        description: Reviewed UI change that justifies a baseline refresh
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep routine CI runs on the Chromium smoke suite. The full matrix remains
  # available for reviewed PRs through a label or for manual dispatches.
  FULL_BROWSER_SUITE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.full_browser_suite != 'false') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-browser-suite')) }}
  ATT_UI_UPDATE_VISUAL_BASELINES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baselines == 'true' && '1' || '0' }}
  ATT_UI_VISUAL_BASELINE_REASON: ${{ github.event.inputs.visual_baseline_reason || '' }}

jobs:
  java-8-compatibility:
    name: Java 8 / CLI, Engine, and Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Java 8 modules
        run: mvn -B -ntp -U -pl att-engine,att-cli,att-worker -am clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java8-${{ github.run_id }}
          path: |
            att-engine/target/surefire-reports/
            att-cli/target/surefire-reports/
            att-worker/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend-unit:
    name: Frontend typecheck, unit tests, and Vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: att-web/frontend/package-lock.json

      - name: Verify React, TypeScript, component tests, Vite build, and bundle budget
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run bundle:budget
        working-directory: att-web/frontend

      - name: Verify ATT Web UI JavaScript
        run: |
          node --check att-web/src/main/resources/META-INF/resources/ui/app.js
          node --test att-web/src/test/js/*.test.mjs

      - name: Upload built UI assets for browser acceptance
        uses: actions/upload-artifact@v4
        with:
          name: att-ui-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: att-web/frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # Split expensive Server unit tests from WAR integration and release packaging.
  # Run in parallel with the release job; both checks are required to merge.
  java-17-server-unit:
    name: Java 17 / Server unit and authentication tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up pinned Node.js for ATT Web module
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: att-web/frontend/package-lock.json

      - name: Verify all Server unit tests with isolated parallel JVMs
        # Each test class gets a separate JVM, isolating Tomcat, global properties,
        # authentication state and temporary database files. Tests within a class
        # remain sequential; no tests or assertions are excluded.
        # ubuntu-24.04 has 4 vCPUs. Four forks overlap the long Server classes.
        # Each test JVM is capped so four forks plus their Worker processes fit
        # in the runner without raising the job timeout.
        run: mvn -B -ntp -U -T 1C -pl att-worker,att-server -am -Datt.skipJava8ModuleTests=true -Datt.skipFrontendUnitTests=true -DforkCount=4 -DreuseForks=false -DargLine=-Xmx2g test

      - name: Upload Server unit reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-server-unit-${{ github.run_id }}
          path: att-server/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  java-17-server-and-release:
    name: Java 17 / Server and full distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up pinned Node.js for build-time UI tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            att-web/frontend/package-lock.json
            tools/ui-acceptance/package-lock.json

      - name: Install Playwright Chromium for ServerWarUiIT
        working-directory: tools/ui-acceptance
        run: npm ci

      - name: Cache Playwright Chromium for ServerWarUiIT
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/ui-acceptance/package-lock.json') }}-chromium

      - name: Install Playwright Chromium for ServerWarUiIT
        working-directory: tools/ui-acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify documentation release gate
        run: python3 tools/verify_documentation.py

      - name: Verify assembled release
        # Java 8, frontend and Server unit tests have dedicated parallel jobs;
        # the packaged-WAR API smoke and release/launcher checks still run here.
        env:
          ATT_CI_SKIP_COVERED_TESTS: "true"
          ATT_UI_SERVER_PLAYWRIGHT: "1"
        run: ./build.sh

      - name: Upload Local and Server release packages
        uses: actions/upload-artifact@v4
        with:
          name: att-release-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/releases/att-*-local.tar.gz
            dist/releases/att-*-server.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-17-surefire-reports-${{ github.run_id }}
          path: |
            att-engine/target/surefire-reports/
            att-cli/target/surefire-reports/
            att-worker/target/surefire-reports/
            att-server/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Run the Tomcat 11 redeploy lifecycle in parallel with the full distribution
  # build. It is a required regression, but does not need to extend that job's
  # release-packaging critical path.
  java-17-tomcat-11-redeploy:
    name: Java 17 / Tomcat 11 redeploy lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify same-JVM redeploy lifecycle on Tomcat 11
        # ServerWarUiIT assembles a Local runtime from att-worker/target/classes,
        # so include Worker explicitly even though it is not a Server dependency.
        run: mvn -B -ntp -Ptomcat-11 -pl att-worker,att-server -am -Datt.skipJava8ModuleTests=true -Datt.skipFrontendUnitTests=true -Datt.skipServerUnitTests=true '-Dit.test=ServerWarUiIT#repeatedRedeployReleasesCompactorsAndJdbcWhilePreservingSchedulesAndJournals' verify

      - name: Upload Tomcat 11 test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-tomcat-11-${{ github.run_id }}
          path: att-server/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Build the static UI once before running the Python fixture-backed browser suites.
  # Keeping the suites in one job avoids four concurrent Chromium/dependency installs.
  ui-browser-acceptance:
    name: UI browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: frontend-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            att-web/frontend/package-lock.json
            tools/ui-acceptance/package-lock.json

      - name: Download validated UI assets
        uses: actions/download-artifact@v4
        with:
          name: att-ui-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: att-web/frontend/dist/

      - name: Install browser acceptance dependencies
        run: npm ci
        working-directory: tools/ui-acceptance

      - name: Report browser acceptance scope
        run: |
          echo "### Browser acceptance scope" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FULL_BROWSER_SUITE" = "true" ]; then
            echo "- **Full matrix:** Chromium, Firefox, and WebKit at 1280/768/390 px in light and dark themes (18 screenshot comparisons)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Quick smoke:** Chromium functional suites only. The 18-capture cross-browser comparison did not run." >> "$GITHUB_STEP_SUMMARY"
            echo "- Run the full matrix before merge by adding the \`full-browser-suite\` label or dispatching **CI** on the PR branch." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$ATT_UI_UPDATE_VISUAL_BASELINES" = "1" ]; then
            echo "- **Baseline refresh:** replacement captures will be uploaded for review; this run does not commit them." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/ui-acceptance/package-lock.json') }}-${{ env.FULL_BROWSER_SUITE == 'true' && 'all' || 'chromium' }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('tools/ui-acceptance/package-lock.json') }}-chromium

      - name: Install Playwright browsers
        working-directory: tools/ui-acceptance
        run: |
          if [ "$FULL_BROWSER_SUITE" = "true" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Chromium UI suites
        working-directory: tools/ui-acceptance
        env:
          ATT_UI_UPDATE_VISUAL_BASELINES: ${{ env.ATT_UI_UPDATE_VISUAL_BASELINES }}
          ATT_UI_VISUAL_BASELINE_REASON: ${{ env.ATT_UI_VISUAL_BASELINE_REASON }}
        run: |
          npm run smoke
          npm run smoke:explorer
          npm run smoke:archive-metrics
          npm run smoke:load-templates
          npm run smoke:load-jobs
          npm run smoke:job-replay
          npm run smoke:run
          npm run smoke:auth
          npm run smoke:scheduled-load
          npm run smoke:schedules
          if [ "$FULL_BROWSER_SUITE" = "true" ]; then
            npm run smoke:cross-browser
            npm run screenshots
          fi

      - name: Upload Scheduled Load cross-browser screenshots
        if: always() && env.FULL_BROWSER_SUITE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-load-browser-screenshots-${{ github.run_id }}
          path: tools/ui-acceptance/artifacts/scheduled-load/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reviewed visual baselines
        if: success() && env.FULL_BROWSER_SUITE == 'true' && env.ATT_UI_UPDATE_VISUAL_BASELINES == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-load-visual-baselines-linux-${{ github.run_id }}
          path: tools/ui-acceptance/visual-baselines/scheduled-load/linux/
          if-no-files-found: error
          retention-days: 7

  windows-worker-process-tree:
    name: Java 8 Windows Tool and source-launcher regressions
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Java 8 Windows Tool cancellation and source-tree launcher
        run: mvn -B -ntp -U -pl att-cli,att-worker -am "-Dtest=ProcessTreeTerminatorWindowsTest,WorkerMainTest#terminatingWorkerStopsAnActiveCommandBackedTool,WindowsLauncherTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
