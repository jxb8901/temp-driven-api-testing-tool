schemaVersion: att-sut-metrics-source/v1
id: prom-main
name: SIT Prometheus
provider: PROMETHEUS
url: https://prometheus-sit.example.invalid
apiPath: /api/v1/query_range
tls:
  verify: true
auth:
  mode: BEARER
  secretRef: PROMETHEUS_SIT_TOKEN
readers: [load-observer]
readRoles: [USER, ADMIN]
limits:
  connectTimeoutMs: 5000
  requestTimeoutMs: 15000
  maxRangeSeconds: 86400
  maxResponseBytes: 2097152
  maxSamplesPerJob: 250000
  maxSeriesPerJob: 128
