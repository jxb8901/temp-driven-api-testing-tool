schemaVersion: att-load/v1.4
workloads:
- target:
    type: tool
    id: sample.getAcDate
  load:
    arrivalRate: 2/s
    duration: 2s
    maxConcurrent: 2
    overloadPolicy: drop
  id: arrival-smoke
execution:
  execIdFormat: ${EXEC.RUN_ID}-${EXEC.LOAD.WORKLOAD_ID}-arrival-${EXEC.LOAD.ITERATION}
