schemaVersion: att-load/v1.5
workloads:
- target:
    type: flow
    id: common.compose.v1
  load:
    arrivalRate: 100/s
    warmup: 30s
    rampUp: 60s
    duration: 5m
    rampDown: 30s
    maxConcurrent: 500
    overloadPolicy: drop
  thresholds:
    droppedRate: == 0%
    achievedArrivalRate: '>= 99%'
  id: arrival-rate
execution:
  execIdFormat: ${EXEC.RUN_ID}-${EXEC.LOAD.WORKLOAD_ID}-arrival-${EXEC.LOAD.ITERATION}
