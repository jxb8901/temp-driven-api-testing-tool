schemaVersion: att-flow/v3.0
id: common.decorate.v1
name: Decorate Value
description: V3.2 CASE.VARS assignment and conditional skipping inside a Flow.
actions:
  decoratedValue:
    type: assign
    name: decoratedResult
    expression: "${ACTIONS.identityValue.output.result}-done"
  auditDecoration:
    type: log
    message: "Decorated ${CASE.VARS.decoratedResult}"
    runWhen: "false"
