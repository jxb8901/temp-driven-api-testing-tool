schemaVersion: att-flow/v3.0
id: common.decorate.v1
name: Decorate Value
description: Demonstrate local assignment and conditional skipping.
inputs:
  value:
    type: string
    required: true
  decorate:
    type: boolean
    default: true
actions:
  decorated:
    type: assign
    name: result
    expression: "${input.value}-done"
  audit:
    type: log
    message: "Decorated ${runtime.result}"
    runWhen: "${input.decorate} == false"
outputs:
  value:
    type: string
    from: "${runtime.result}"
