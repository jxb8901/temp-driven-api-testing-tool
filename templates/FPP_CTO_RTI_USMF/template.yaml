schemaVersion: att-template/v3.6
name: CTO/RTI流程模板
description: USMF CTO success plus RTI success transaction flow with API, log, and database verification.

# CASE message inputs:
# precheckRequestId, precheckRequestType,
# confirmRequestId, confirmRequestType, confirmRequestFile,
# pacs004RequestId, pacs004RequestType, pacs004RequestFile, apiLogPath,
# apiSuccessCode, transactionLogFile, precheckLogKeyword, confirmLogKeyword,
# pacs002AcscLogFile, pacs002AcscKeyword, pacs002AcccLogFile,
# pacs002AcccKeyword, artifactDirectory, amount.
# Every *SqlFile must print one summary row with RECORD_COUNT, MATCH_COUNT,
# and RESULT_SUMMARY. MATCH_COUNT covers the business condition named below.
actions:
  buildTxnSeq:
    type: assign
    name: TxnSeq
    expression: ATT000${META.SOURCE.caseId}#{sysdate('yyyyMMdd')}#{sample.getSeq(6)}

  preparePrecheckRequest:
    type: assign
    name: precheckRequest
    description: "0. Read the CT001 Precheck project file"
    expression: "&{templates/FPP_CTO_RTI_USMF/CT001_Precheck.xml}"

  log1:
    type: log
    message: "====================== Starting testcase ${META.SOURCE.caseId} ======================"
    value:
      precheckResult: "${EXEC.ACTIONS.buildTxnSeq.output}"
      requestFormat: xml

  invokePrecheck:
    type: tool
    description: "1. Send CT001 Precheck"
    call: "#{fpp.invokeApi(requestId=${EXEC.VARS.TxnSeq}, requestType='fromchannel', requestText=${EXEC.VARS.precheckRequest}, apiLogPath='invokePrecheck.log')}"

  assertPrecheck:
    type: assert
    description: CT001 Precheck succeeds
    assert: "${EXEC.ACTIONS.invokePrecheck.output.exitCode} == 0 and ${EXEC.ACTIONS.invokePrecheck.output.result.ResultCode} == 'SUCCESS'"
    expected: "ResultCode=SUCCESS, message=Precheck successful"
    actual: "ResultCode=${EXEC.ACTIONS.invokePrecheck.output.result.ResultCode}, message=${EXEC.ACTIONS.invokePrecheck.output.result.ResultMessage}"

x-staged:
  searchPrecheckLog:
    type: tool
    description: "1.2 Check CT001 Precheck transaction log keyword"
    call: "#{fpp.searchText(file=${EXEC.INPUT.transactionLogFile}, keyword=${EXEC.INPUT.precheckLogKeyword})}"

  assertPrecheckLog:
    type: assert
    description: CT001 Precheck transaction log contains the expected keyword
    assert: "${EXEC.ACTIONS.searchPrecheckLog.output.exitCode} == 0 and ${EXEC.ACTIONS.searchPrecheckLog.output.result.found} == true"
    expected: "transaction log contains ${EXEC.INPUT.precheckLogKeyword}"
    actual: "found=${EXEC.ACTIONS.searchPrecheckLog.output.result.found}, count=${EXEC.ACTIONS.searchPrecheckLog.output.result.count}"

  invokeConfirm:
    type: tool
    description: "2. Send CT001 Confirm"
    call: "#{fpp.invokeApi(requestId=${EXEC.INPUT.confirmRequestId}, requestType=${EXEC.INPUT.confirmRequestType}, requestFile=${EXEC.INPUT.confirmRequestFile}, apiLogPath=${EXEC.INPUT.apiLogPath})}"

  assertConfirm:
    type: assert
    description: CT001 Confirm succeeds
    assert: "${EXEC.ACTIONS.invokeConfirm.output.exitCode} == 0 and ${EXEC.ACTIONS.invokeConfirm.output.result.ResultCode} == '${EXEC.INPUT.apiSuccessCode}'"
    expected: "ResultCode=${EXEC.INPUT.apiSuccessCode}"
    actual: "ResultCode=${EXEC.ACTIONS.invokeConfirm.output.result.ResultCode}, message=${EXEC.ACTIONS.invokeConfirm.output.result.ResultMessage}"

  searchConfirmLog:
    type: tool
    description: "2.2 Check CT001 Confirm transaction log keyword"
    call: "#{fpp.searchText(file=${EXEC.INPUT.transactionLogFile}, keyword=${EXEC.INPUT.confirmLogKeyword})}"

  assertConfirmLog:
    type: assert
    description: CT001 Confirm transaction log contains the expected keyword
    assert: "${EXEC.ACTIONS.searchConfirmLog.output.exitCode} == 0 and ${EXEC.ACTIONS.searchConfirmLog.output.result.found} == true"
    expected: "transaction log contains ${EXEC.INPUT.confirmLogKeyword}"
    actual: "found=${EXEC.ACTIONS.searchConfirmLog.output.result.found}, count=${EXEC.ACTIONS.searchConfirmLog.output.result.count}"

  queryCtoAfterConfirm:
    type: tool
    description: "3.1 Poll CTO transaction until ACSC and ACCC states succeed"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.ctoAcscAcccSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/cto-acsc-accc.out', stderrPath='${EXEC.INPUT.artifactDirectory}/cto-acsc-accc.err')}"
    timeoutMs: 10000
    retry: &dbRetry
      maxAttempts: 3
      intervalMs: 1000
      retryOn: [ASSERTION]
    assert: "${output.exitCode} == 0 and ${output.result.RowCount} == 1 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.ctoAcscAcccExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.ctoAcscAcccExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.ctoAcscAcccExpectedCount}, ACSC and ACCC successful"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  searchPacs002Acsc:
    type: tool
    description: "3.2-3.3 Obtain and verify Pacs002 ACSC transaction log"
    call: "#{fpp.searchText(file=${EXEC.INPUT.pacs002AcscLogFile}, keyword=${EXEC.INPUT.pacs002AcscKeyword})}"

  assertPacs002Acsc:
    type: assert
    description: Pacs002 ACSC log result matches the expectation
    assert: "${EXEC.ACTIONS.searchPacs002Acsc.output.exitCode} == 0 and ${EXEC.ACTIONS.searchPacs002Acsc.output.result.found} == true"
    expected: "Pacs002 ACSC log contains ${EXEC.INPUT.pacs002AcscKeyword}"
    actual: "found=${EXEC.ACTIONS.searchPacs002Acsc.output.result.found}, count=${EXEC.ACTIONS.searchPacs002Acsc.output.result.count}"

  searchPacs002Accc:
    type: tool
    description: "3.4-3.5 Obtain and verify Pacs002 ACCC transaction log"
    call: "#{fpp.searchText(file=${EXEC.INPUT.pacs002AcccLogFile}, keyword=${EXEC.INPUT.pacs002AcccKeyword})}"

  assertPacs002Accc:
    type: assert
    description: Pacs002 ACCC log result matches the expectation
    assert: "${EXEC.ACTIONS.searchPacs002Accc.output.exitCode} == 0 and ${EXEC.ACTIONS.searchPacs002Accc.output.result.found} == true"
    expected: "Pacs002 ACCC log contains ${EXEC.INPUT.pacs002AcccKeyword}"
    actual: "found=${EXEC.ACTIONS.searchPacs002Accc.output.result.found}, count=${EXEC.ACTIONS.searchPacs002Accc.output.result.count}"

  invokePacs004:
    type: tool
    description: "4. Simulate sending Pacs004 under the configured FPS Console condition"
    call: "#{fpp.invokeApi(requestId=${EXEC.INPUT.pacs004RequestId}, requestType=${EXEC.INPUT.pacs004RequestType}, requestFile=${EXEC.INPUT.pacs004RequestFile}, apiLogPath=${EXEC.INPUT.apiLogPath})}"

  assertPacs004:
    type: assert
    description: Pacs004 simulation reports no error
    assert: "${EXEC.ACTIONS.invokePacs004.output.exitCode} == 0 and ${EXEC.ACTIONS.invokePacs004.output.result.ResultCode} == '${EXEC.INPUT.apiSuccessCode}'"
    expected: "ResultCode=${EXEC.INPUT.apiSuccessCode}"
    actual: "ResultCode=${EXEC.ACTIONS.invokePacs004.output.result.ResultCode}, message=${EXEC.ACTIONS.invokePacs004.output.result.ResultMessage}"

  queryRtiTxn:
    type: tool
    description: "5. Poll RTI transaction until successful with the testcase amount"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.rtiTxnSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/rti-txn.out', stderrPath='${EXEC.INPUT.artifactDirectory}/rti-txn.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.RowCount} == 1 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.rtiTxnExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.rtiTxnExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.rtiTxnExpectedCount}, RTI success, amount=${EXEC.INPUT.amount}"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  queryCtoRefund:
    type: tool
    description: "6. Poll CTO transaction until the specified OID is refunded"
    call: "#{fpp.querySqlplus(sqlFile=${EXEC.INPUT.ctoRefundSqlFile}, outputFile='${EXEC.INPUT.artifactDirectory}/cto-refund.out', stderrPath='${EXEC.INPUT.artifactDirectory}/cto-refund.err')}"
    timeoutMs: 10000
    retry: *dbRetry
    assert: "${output.exitCode} == 0 and ${output.result.RowCount} == 1 and ${output.result.Rows.Row.RECORD_COUNT} == ${EXEC.INPUT.ctoRefundExpectedCount} and ${output.result.Rows.Row.MATCH_COUNT} == ${EXEC.INPUT.ctoRefundExpectedCount}"
    expected: "recordCount=${EXEC.INPUT.ctoRefundExpectedCount}, specified OID is refunded"
    actual: "${output.result.Rows.Row.RESULT_SUMMARY}"

  logCtoRtiSummary:
    type: log
    message: "CTO plus RTI success flow completed for ${META.SOURCE.caseId}"
    value:
      precheckResult: "${EXEC.ACTIONS.invokePrecheck.output.result.ResultCode}"
      confirmResult: "${EXEC.ACTIONS.invokeConfirm.output.result.ResultCode}"
      pacs004Result: "${EXEC.ACTIONS.invokePacs004.output.result.ResultCode}"
      rtiSummary: "${EXEC.ACTIONS.queryRtiTxn.output.result.Rows.Row.RESULT_SUMMARY}"
      refundSummary: "${EXEC.ACTIONS.queryCtoRefund.output.result.Rows.Row.RESULT_SUMMARY}"
