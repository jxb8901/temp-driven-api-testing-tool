schemaVersion: att-template/v3.6
name: PAYMENT_PREPARE
description: Prepare payment request identifiers.

actions:
  getAcDate:
    type: tool
    call: "#{getAcDate()}"

  getSeq:
    type: tool
    call: "#{getSeq(caseId=${META.SOURCE.caseId})}"

  genEndToEndId:
    type: tool
    call: "#{genEndToEndId(caseId=${META.SOURCE.caseId})}"

  logIds:
    type: log
    message: "Prepared IDs for ${META.SOURCE.caseId}"
    value:
      acDate: "${EXEC.ACTIONS.getAcDate.output.result}"
      sequence: "${EXEC.ACTIONS.getSeq.output.result}"
      endToEndId: "${EXEC.ACTIONS.genEndToEndId.output.result}"
