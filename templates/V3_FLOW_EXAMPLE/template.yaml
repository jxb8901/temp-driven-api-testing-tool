schemaVersion: att-template/v3.0
name: V3_FLOW_EXAMPLE
description: V3.4.2 Template composing isolated Flow Action scopes.
actions:
  compose:
    type: flow
    description: Compose the Case value through two nested Flows.
    use: common.compose.v1
  verify:
    type: assert
    description: Verify the explicit EXEC.VARS value published by the Flow.
    assert: >-
      #{${META.SOURCE.caseId} in [${META.SOURCE.caseId}]
        and ${EXEC.VARS.decoratedResult} == #{concat(${META.SOURCE.caseId}, '-done')}
        and (1 + 2 * 3) == 7}
    expected: "${META.SOURCE.caseId}-done"
    actual: "${EXEC.VARS.decoratedResult}"
