schemaVersion: att-template/v3.0
name: V3_FLOW_EXAMPLE
description: Minimal V3.1 Template composing reusable Actions in one shared Context.
actions:
  compose:
    type: flow
    description: Compose the Case value through two nested Flows.
    use: common.compose.v1
  verify:
    type: assert
    description: Verify the internal Action result through the ordinary ACTIONS Context.
    assert: "${ACTIONS.decoratedValue.output.result} == '${CASE.caseId}-done'"
    expected: "${CASE.caseId}-done"
    actual: "${ACTIONS.decoratedValue.output.result}"
