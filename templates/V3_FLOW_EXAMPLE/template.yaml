schemaVersion: att-template/v3.0
name: V3_FLOW_EXAMPLE
description: V3.2 Template composing reusable Actions in one shared Context.
actions:
  compose:
    type: flow
    description: Compose the Case value through two nested Flows.
    use: common.compose.v1
  verify:
    type: assert
    description: Verify Flow output with the ordinary ACTIONS Context and a typed expression block.
    assert: >-
      #{${CASE.caseId} in [${CASE.caseId}]
        and ${ACTIONS.decoratedValue.output.result} == #{concat(${CASE.caseId}, '-done')}
        and (1 + 2 * 3) == 7}
    expected: "${CASE.caseId}-done"
    actual: "${ACTIONS.decoratedValue.output.result}"
