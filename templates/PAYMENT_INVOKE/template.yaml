schemaVersion: att-template/v3.4
name: PAYMENT_INVOKE
description: Render payment request XML as a String and invoke the payment API.

actions:
  renderRequest:
    type: render
    payload: payload.xml

  logRequest:
    type: log
    level: INFO
    message: "Rendered request for ${CASE.caseId}"
    value: "${ACTIONS.renderRequest.output.result}"

  callApi:
    type: tool
    call: "#{invokePaymentApi(requestText=${ACTIONS.renderRequest.output.result}, environment=${CASE.environment})}"

  publishApiStatus:
    type: assign
    name: lastApiStatus
    expression: "${EXEC.ACTIONS.callApi.output.result.Status}"

  publishApiRejectCode:
    type: assign
    name: lastApiRejectCode
    expression: "${EXEC.ACTIONS.callApi.output.result.RejectCode?}"
