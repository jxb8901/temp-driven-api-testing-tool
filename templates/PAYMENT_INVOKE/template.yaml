schemaVersion: att-template/v3.1
name: PAYMENT_INVOKE
description: Render payment request XML to a file and invoke the payment API.

actions:
  renderRequest:
    type: render
    payload: payload.xml
    result:
      format: text
      path: rendered/{filename}

  logRequest:
    type: log
    level: INFO
    message: "Rendered request for ${CASE.caseId}"
    fields:
      requestFile: "${ACTIONS.renderRequest.output.targetFiles[0]}"

  callApi:
    type: tool
    call: "#{invokePaymentApi(requestFile=${ACTIONS.renderRequest.output.targetFiles[0]}, environment=${CASE.environment})}"

  publishApiStatus:
    type: assign
    name: lastApiStatus
    expression: "${EXEC.ACTIONS.callApi.output.result.Status}"

  publishApiRejectCode:
    type: assign
    name: lastApiRejectCode
    expression: "${EXEC.ACTIONS.callApi.output.result.RejectCode?}"
