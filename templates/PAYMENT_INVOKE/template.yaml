schemaVersion: att-template/v3.5
name: PAYMENT_INVOKE
description: Read the payment request project file as a String and invoke the payment API.

actions:
  prepareRequest:
    type: assign
    name: requestText
    expression: "&{templates/PAYMENT_INVOKE/payload.xml}"

  logRequest:
    type: log
    message: "Project-file request for ${CASE.caseId}"
    value: "${EXEC.VARS.requestText}"

  callApi:
    type: tool
    call: "#{invokePaymentApi(requestText=${EXEC.VARS.requestText}, environment=${CASE.environment})}"

  publishApiStatus:
    type: assign
    name: lastApiStatus
    expression: "${EXEC.ACTIONS.callApi.output.result.Status}"

  publishApiRejectCode:
    type: assign
    name: lastApiRejectCode
    expression: "${EXEC.ACTIONS.callApi.output.result.RejectCode?}"
